<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Don Arturo - Catálogo Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Tienda Don Arturo - <span>Catálogo Premium</span></h1>
    </header>

    <main class="catalogo" id="grid"></main>

    <footer class="footer">
        <div class="footer-content">
            <div class="total-box">
                Subtotal Estimado
                <span id="total">COP $0</span>
            </div>
            <button class="btn-finalizar" id="btn-finalizar">Finalizar Pedido</button>
        </div>
    </footer>

    <script>
        const grid = document.getElementById('grid');
        const totalTXT = document.getElementById('total');
        const btnFinalizar = document.getElementById('btn-finalizar');
        
        let totalAcumulado = 0;
        let productosSeleccionados = [];

        // Función encargada de dibujar los productos en su pantalla oscura
        function mostrarProductos(lista) {
            grid.innerHTML = '';
            lista.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'producto';
                
                // Truco de diseño: extrae las iniciales del producto para el ícono de fondo
                const inicial = prod.nombre.split(' ')[0].substring(0, 2).toUpperCase();

                card.innerHTML = `
                    <div class="indicador"></div>
                    <div class="img-placeholder">${inicial}</div>
                    <h3>${prod.nombre}</h3>
                    <div class="precio">COP $${prod.precio.toLocaleString('es-CO')}</div>
                `;

                // Qué pasa cuando Diego o un cliente hace clic en una tarjeta:
                card.onclick = function() {
                    card.classList.toggle('seleccionado');
                    
                    if (card.classList.contains('seleccionado')) {
                        totalAcumulado += prod.precio;
                        productosSeleccionados.push(prod);
                    } else {
                        totalAcumulado -= prod.precio;
                        productosSeleccionados = productosSeleccionados.filter(item => item.id !== prod.id);
                    }
                    
                    // Actualiza la cifra matemática del total al instante
                    totalTXT.innerText = `COP $${totalAcumulado.toLocaleString('es-CO')}`;
                };

                grid.appendChild(card);
            });
        }

        // TRUCO TÉCNICO VITAL: Los navegadores modernos bloquean la lectura de archivos locales 
        // directamente desde el computador por seguridad (CORS). 
        // Para que Diego pueda probar su catálogo YA MISMO con doble clic, dejamos un respaldo 
        // idéntico aquí. Al subirlo a GitHub, el sistema leerá el archivo productos.json automáticamente.
        fetch('productos.json')
            .then(response => response.json())
            .then(data => mostrarProductos(data))
            .catch(error => {
                const respaldoFijo = [
                  { "id": 1, "nombre": "Arroz Roa (1 Lb)", "precio": 2400 },
                  { "id": 2, "nombre": "Aceite Premier (1.000 ml)", "precio": 12800 },
                  { "id": 3, "nombre": "Leche Alquería (1 Litro)", "precio": 4900 },
                  { "id": 4, "nombre": "Huevos AAA (Cubeta x 30)", "precio": 16500 },
                  { "id": 5, "nombre": "Pan Tajado Bimbo Grande", "precio": 9200 },
                  { "id": 6, "nombre": "Café Sello Rojo (250g)", "precio": 6800 },
                  { "id": 7, "nombre": "Chocolate Sol (500g)", "precio": 7200 },
                  { "id": 8, "nombre": "Azúcar Manuelita (1 Kilo)", "precio": 4500 },
                  { "id": 9, "nombre": "Sal Refisal (1 Kilo)", "precio": 2100 },
                  { "id": 10, "nombre": "Harina de Maíz Promasa", "precio": 4800 },
                  { "id": 11, "nombre": "Frijol Bola Roja Doria", "precio": 7900 },
                  { "id": 12, "nombre": "Pasta Doria Espagueti", "precio": 4100 },
                  { "id": 13, "nombre": "Atún Van Camp's (160g)", "precio": 8500 },
                  { "id": 14, "nombre": "Queso Campesino Alpina", "precio": 14200 },
                  { "id": 15, "nombre": "Mantequilla Rama (250g)", "precio": 5400 },
                  { "id": 16, "nombre": "Coca-Cola (1.5 Litros)", "precio": 5200 },
                  { "id": 17, "nombre": "Papas Margarita Pollo", "precio": 4900 },
                  { "id": 18, "nombre": "Jabón Rey (Barra 300g)", "precio": 3200 },
                  { "id": 19, "nombre": "Detergente Fab (900g)", "precio": 10500 },
                  { "id": 20, "nombre": "Papel Higiénico Familia", "precio": 6400 }
                ];
                mostrarProductos(respaldoFijo);
            });

        // Acción al presionar "Finalizar Pedido"
        btnFinalizar.onclick = function() {
            if (productosSeleccionados.length === 0) {
                alert("Por favor, seleccione al menos un producto para su pedido.");
                return;
            }
            
            alert(`¡Éxito! Pedido procesado para ${productosSeleccionados.length} artículos.\nTotal acumulado: $${totalAcumulado.toLocaleString('es-CO')} COP.\n\n¡La lógica funciona a la perfección!`);
        };
    </script>
</body>
</html>
