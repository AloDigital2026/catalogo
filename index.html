<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Don Arturo - Catálogo Premium</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .selector-cantidad {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }
        .btn-cantidad {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid rgba(48,209,88,0.35);
            background: #1a1a1a;
            color: #30D158;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            transition: all 0.2s ease;
        }
        .btn-cantidad:hover { background: #30D158; color: #000; border-color: #30D158; }
        .cantidad-numero {
            min-width: 20px;
            text-align: center;
            font-weight: bold;
        }
        .producto.seleccionado { border-color: #30D158; }

        /* ===== Chat de texto con Arturo ===== */
        #chat-arturo {
            width: 100%;
            max-width: 480px;
            margin: 0 auto 12px;
            background: rgba(0,0,0,0.35);
            border-radius: 10px;
            padding: 10px;
        }
        #chat-input {
            box-shadow: 0 0 8px rgba(48,209,88,0.35), 0 0 2px rgba(48,209,88,0.5) inset;
            transition: box-shadow 0.25s ease;
        }
        #chat-input:focus {
            outline: none;
            box-shadow: 0 0 14px rgba(48,209,88,0.6), 0 0 3px rgba(48,209,88,0.7) inset;
        }
        #chat-historial {
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
            padding-right: 4px;
        }
        .msg-chat {
            font-size: 13px;
            padding: 6px 10px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.3;
        }
        .msg-cliente {
            align-self: flex-end;
            background: #1F6642;
            color: white;
        }
        .msg-arturo {
            align-self: flex-start;
            background: #333;
            color: #eee;
        }
        #chat-form {
            display: flex;
            gap: 6px;
        }
        #chat-input {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
        }
        #chat-enviar {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background: #30D158;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
        }
        #chat-enviar:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ===== NUEVO: Botón "Ver lista completa" ===== */
        .btn-lista-completa {
            display: block;
            width: 100%;
            max-width: 480px;
            margin: 0 auto 16px;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(48,209,88,0.35);
            background: #1a1a1a;
            color: #30D158;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }
        .btn-lista-completa:hover { background: #30D158; color: #000; }

        /* ===== NUEVO: Panel de lista completa ===== */
        #panel-lista {
            max-width: 480px;
            margin: 0 auto 16px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(48,209,88,0.25);
            border-radius: 10px;
            padding: 12px;
        }
        #panel-lista.oculto { display: none; }

        #buscador-lista {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            margin-bottom: 10px;
        }

        #lista-productos {
            max-height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .lista-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            background: #1a1a1a;
            border: 1px solid transparent;
        }
        .lista-item.seleccionado { border-color: #30D158; }

        .lista-item-info {
            flex: 1;
            min-width: 0;
        }
        .lista-item-nombre {
            font-size: 13px;
            color: #eee;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .lista-item-precio {
            font-size: 13px;
            color: #30D158;
            font-weight: bold;
        }

        .lista-item .selector-cantidad {
            margin-top: 0;
            flex-shrink: 0;
        }

        .sin-resultados {
            color: #888;
            font-size: 13px;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>Tienda Don Arturo - <span>Catálogo Premium</span></h1>
    </header>

    <p class="instrucciones">
        👀 Mire lo que tenemos y arme su pedido tocando <strong>−</strong> / <strong>+</strong>,
        o <strong>escríbale directo a Arturo</strong> abajo lo que necesita.
        Si le escribe, cuéntele de una vez su <strong>pedido, dirección y forma de pago</strong>
        — así le responde más rápido.
    </p>

    <!-- NUEVO: botón para abrir la lista completa -->
    <button type="button" class="btn-lista-completa" id="btn-toggle-lista">
        📋 ¿No encuentra lo que busca? Ver lista completa de productos
    </button>

    <!-- NUEVO: panel de lista completa (oculto por defecto) -->
    <div id="panel-lista" class="oculto">
        <input type="text" id="buscador-lista" placeholder="🔎 Buscar producto..." autocomplete="off">
        <div id="lista-productos"></div>
    </div>

    <main class="catalogo" id="grid"></main>

    <footer class="footer">
        <div class="footer-content" style="flex-direction: column; gap: 8px;">

            <div id="chat-arturo">
                <div id="chat-historial"></div>
                <form id="chat-form">
                    <input type="text" id="chat-input" placeholder="Escríbale a Arturo su pedido..." autocomplete="off">
                    <button type="submit" id="chat-enviar">Enviar</button>
                </form>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <div class="total-box">
                    Subtotal Estimado
                    <span id="total">COP $0</span>
                </div>
                <div>
                    <button class="btn-finalizar" id="btn-finalizar">Finalizar Pedido</button>
                </div>
            </div>

        </div>
    </footer>

    <script>
        const grid = document.getElementById('grid');
        const totalTXT = document.getElementById('total');
        const btnFinalizar = document.getElementById('btn-finalizar');

        const URL_BACKEND = 'https://script.google.com/macros/s/AKfycbzDPoeuLQOOKbS_3eblLFcuRUmYr1Wsxjq5pM2tQKUbSNXOCraqe4QrGKp-8q0MZkzmqw/exec';

        let totalAcumulado = 0;
        let cantidades = {};

        // NUEVO: guardamos aquí el catálogo completo que ya trae el backend,
        // para poder mostrarlo en la lista sin pedirlo de nuevo.
        let catalogoCompleto = [];

        function recalcularTotal() {
            totalAcumulado = 0;
            Object.values(cantidades).forEach(item => {
                totalAcumulado += item.producto.precio * item.cantidad;
            });
            totalTXT.innerText = `COP $${totalAcumulado.toLocaleString('es-CO')}`;
        }

        // MODIFICADO: ahora actualiza TODAS las tarjetas del mismo producto
        // (la de fotos y la de la lista completa, si existen las dos)
        // usando data-id en vez de un único id fijo por producto.
        function actualizarTarjeta(prod) {
            const cantidadActual = cantidades[prod.id] ? cantidades[prod.id].cantidad : 0;
            document.querySelectorAll(`[data-id="${prod.id}"]`).forEach(el => {
                const numeroEl = el.querySelector('.cantidad-numero');
                if (numeroEl) numeroEl.innerText = cantidadActual;
                el.classList.toggle('seleccionado', cantidadActual > 0);
            });
        }

        function cambiarCantidad(prod, delta) {
            const actual = cantidades[prod.id] ? cantidades[prod.id].cantidad : 0;
            const nueva = Math.max(0, actual + delta);

            if (nueva === 0) {
                delete cantidades[prod.id];
            } else {
                cantidades[prod.id] = { producto: prod, cantidad: nueva };
            }

            actualizarTarjeta(prod);
            recalcularTotal();
        }

        // MODIFICADO: se agrega data-id="${prod.id}" a la tarjeta,
        // necesario para que actualizarTarjeta() la encuentre.
        function mostrarProductos(lista) {
            grid.innerHTML = '';
            lista.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'producto';
                card.id = `card-${prod.id}`;
                card.dataset.id = prod.id;

                card.innerHTML = `
                    <div class="indicador"></div>
                    <div class="img-placeholder">
                        <img src="img/${prod.img}" alt="${prod.nombre}" class="img-producto">
                    </div>
                    <h3>${prod.nombre}</h3>
                    <div class="precio">COP $${prod.precio.toLocaleString('es-CO')}</div>
                    <div class="selector-cantidad">
                        <button class="btn-cantidad" data-accion="menos">−</button>
                        <span class="cantidad-numero" id="cantidad-${prod.id}">0</span>
                        <button class="btn-cantidad" data-accion="mas">+</button>
                    </div>
                `;

                card.querySelector('[data-accion="menos"]').onclick = () => cambiarCantidad(prod, -1);
                card.querySelector('[data-accion="mas"]').onclick = () => cambiarCantidad(prod, 1);

                grid.appendChild(card);
            });
        }

        // ===== NUEVO: LISTA COMPLETA DE PRODUCTOS =====
        const btnToggleLista = document.getElementById('btn-toggle-lista');
        const panelLista = document.getElementById('panel-lista');
        const buscadorLista = document.getElementById('buscador-lista');
        const listaProductosEl = document.getElementById('lista-productos');

        function renderizarListaCompleta(lista) {
            listaProductosEl.innerHTML = '';

            if (lista.length === 0) {
                listaProductosEl.innerHTML = '<div class="sin-resultados">No se encontró ningún producto con ese nombre.</div>';
                return;
            }

            lista.forEach(prod => {
                const cantidadActual = cantidades[prod.id] ? cantidades[prod.id].cantidad : 0;

                const item = document.createElement('div');
                item.className = 'lista-item';
                item.dataset.id = prod.id;
                if (cantidadActual > 0) item.classList.add('seleccionado');

                item.innerHTML = `
                    <div class="lista-item-info">
                        <div class="lista-item-nombre">${prod.nombre}</div>
                        <div class="lista-item-precio">COP $${prod.precio.toLocaleString('es-CO')}</div>
                    </div>
                    <div class="selector-cantidad">
                        <button class="btn-cantidad" data-accion="menos">−</button>
                        <span class="cantidad-numero">${cantidadActual}</span>
                        <button class="btn-cantidad" data-accion="mas">+</button>
                    </div>
                `;

                item.querySelector('[data-accion="menos"]').onclick = () => cambiarCantidad(prod, -1);
                item.querySelector('[data-accion="mas"]').onclick = () => cambiarCantidad(prod, 1);

                listaProductosEl.appendChild(item);
            });
        }

        function filtrarYRenderizarLista() {
            const termino = buscadorLista.value.trim().toLowerCase();
            const filtrados = termino
                ? catalogoCompleto.filter(p => p.nombre.toLowerCase().includes(termino))
                : catalogoCompleto;
            renderizarListaCompleta(filtrados);
        }

        btnToggleLista.addEventListener('click', () => {
            const seAbre = panelLista.classList.contains('oculto');
            panelLista.classList.toggle('oculto');
            btnToggleLista.innerText = seAbre
                ? '📋 Ocultar lista de productos'
                : '📋 ¿No encuentra lo que busca? Ver lista completa de productos';
            if (seAbre) {
                filtrarYRenderizarLista();
                ajustarEspacioParaFooter();
            }
        });

        buscadorLista.addEventListener('input', filtrarYRenderizarLista);

        // Las fotos (productos.json) son fijas — se suben a mano cuando hay foto real.
        // El nombre, precio y disponibilidad vienen en vivo de la hoja, igual que Arturo.
        fetch('productos.json')
            .then(response => {
                if (!response.ok) throw new Error('Error al cargar JSON');
                return response.json();
            })
            .then(fotos => {
                fetch(URL_BACKEND + '?accion=obtenerCatalogoWeb')
                    .then(response => response.json())
                    .then(data => {
                        if (data.status !== 'success') throw new Error('Catálogo en vivo no disponible');
                        const enVivoPorId = {};
                        data.productos.forEach(p => { enVivoPorId[p.id] = p; });

                        const combinados = fotos
                            .map(foto => {
                                const vivo = enVivoPorId[foto.id];
                                if (!vivo) return null; // el producto ya no existe en la hoja
                                return { id: foto.id, img: foto.img, nombre: vivo.nombre, precio: vivo.precio, disponible: vivo.disponible };
                            })
                            .filter(p => p && p.disponible); // oculta lo que el tendero marcó agotado

                        mostrarProductos(combinados);

                        // NUEVO: guardamos el catálogo COMPLETO (todo lo disponible en la hoja,
                        // tenga foto o no) para alimentar la lista desplegable.
                        catalogoCompleto = data.productos.filter(p => p.disponible);
                    })
                    .catch(() => mostrarProductos(fotos)); // si falla el backend, muestra las fotos con sus precios fijos
            })
            .catch(error => {
                const respaldoFijo = [
                    { "id": 1, "nombre": "Leche Alquería (1 Litro)", "precio": 4900, "img": "prod_01.jpg" },
                    { "id": 2, "nombre": "Pan Tajado Bimbo Grande", "precio": 9200, "img": "prod_02.jpg" },
                    { "id": 3, "nombre": "Chocolatinas Surtidas", "precio": 3500, "img": "prod_03.jpg" },
                    { "id": 4, "nombre": "Azúcar Manuelita (1 Kg)", "precio": 4200, "img": "prod_04.jpg" },
                    { "id": 5, "nombre": "Café Sello Rojo (250g)", "precio": 6800, "img": "prod_05.jpg" },
                    { "id": 6, "nombre": "Aceite Premier (1.000 ml)", "precio": 12800, "img": "prod_06.jpg" }
                ];
                mostrarProductos(respaldoFijo);
            });

        // ===== CHAT DE TEXTO CON ARTURO =====
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatEnviar = document.getElementById('chat-enviar');
        const chatHistorial = document.getElementById('chat-historial');

        let conversacionArturo = [];

        // ===== Espacio reservado abajo para que la barra fija nunca tape productos =====
        // La barra de abajo (footer) cambia de alto según el contenido del chat,
        // así que medimos su alto real y ajustamos el espacio del catálogo a ese tamaño,
        // en vez de dejar un número fijo que se desactualiza cuando algo cambia.
        const footerEl = document.querySelector('.footer');
        function ajustarEspacioParaFooter() {
            document.body.style.paddingBottom = (footerEl.offsetHeight + 24) + 'px';
        }
        window.addEventListener('load', ajustarEspacioParaFooter);
        window.addEventListener('resize', ajustarEspacioParaFooter);

        function agregarMensajeChat(texto, esCliente) {
            const div = document.createElement('div');
            div.className = 'msg-chat ' + (esCliente ? 'msg-cliente' : 'msg-arturo');
            div.innerText = texto;
            chatHistorial.appendChild(div);
            chatHistorial.scrollTop = chatHistorial.scrollHeight;
            ajustarEspacioParaFooter();
        }

        chatForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const texto = chatInput.value.trim();
            if (!texto) return;

            agregarMensajeChat(texto, true);
            chatInput.value = '';
            chatInput.disabled = true;
            chatEnviar.disabled = true;

            const params = new URLSearchParams({
                accion: 'hablarConArturo',
                texto: texto,
                historial: JSON.stringify(conversacionArturo)
            });

            fetch(URL_BACKEND + '?' + params.toString())
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    conversacionArturo = data.historial;
                    agregarMensajeChat(data.respuesta, false);

                    if (data.terminado) {
                        agregarMensajeChat(`✅ Pedido #${data.pedido_id} confirmado.`, false);
                        conversacionArturo = [];
                        setTimeout(() => {
                            chatHistorial.innerHTML = '';
                        }, 12000);
                    }
                } else {
                    agregarMensajeChat("⚠️ " + (data.message || "No pude entender, intente de nuevo."), false);
                }
            })
            .catch(error => {
                agregarMensajeChat("❌ No se pudo conectar. Intente de nuevo.", false);
            })
            .finally(() => {
                chatInput.disabled = false;
                chatEnviar.disabled = false;
                chatInput.focus();
            });
        });

        // ===== FINALIZAR PEDIDO MANUAL (armado con el catálogo) =====
        btnFinalizar.onclick = function() {
            const itemsSeleccionados = Object.values(cantidades);

            if (itemsSeleccionados.length === 0) {
                alert("Este botón es solo para pedidos armados con el catálogo (use los botones + y − para elegir cantidades).\n\nSi ya le escribió a Arturo por el chat, su pedido ya quedó registrado — no necesita presionar este botón.");
                return;
            }

            const direccion = prompt("Ingrese la dirección de entrega:");
            if (!direccion) {
                alert("Debe ingresar una dirección para continuar.");
                return;
            }

            const observaciones = prompt("Observaciones (opcional): ej. sin bolsa, tocar el timbre, cambiar marca...") || "";

            let formaPago = prompt("¿Cómo desea pagar? Escriba: Efectivo, Nequi, Daviplata o Tarjeta");
            if (!formaPago) {
                formaPago = "No especificado";
            }

            const nombresPedido = itemsSeleccionados
                .map(item => `${item.producto.nombre} x${item.cantidad}`)
                .join(", ");

            const itemsParaDetalle = itemsSeleccionados.map(item => ({
                producto: item.producto.nombre,
                cantidad: item.cantidad,
                precio_unitario: item.producto.precio
            }));

            const params = new URLSearchParams({
                accion: 'crearPedido',
                fecha: new Date().toLocaleString(),
                direccion: direccion,
                pedido: nombresPedido,
                total: totalAcumulado,
                origen: 'Web Catálogo',
                pago: formaPago,
                notas: observaciones,
                estado: 'Recibido',
                items: JSON.stringify(itemsParaDetalle)
            });

            btnFinalizar.disabled = true;
            btnFinalizar.innerText = "Enviando...";

            fetch(URL_BACKEND + '?' + params.toString())
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    alert(`¡Pedido #${data.id} registrado correctamente!\nTotal: $${totalAcumulado.toLocaleString('es-CO')} COP.`);
                    cantidades = {};
                    recalcularTotal();
                    document.querySelectorAll('.producto, .lista-item').forEach(card => {
                        card.classList.remove('seleccionado');
                        const numeroEl = card.querySelector('.cantidad-numero');
                        if (numeroEl) numeroEl.innerText = '0';
                    });
                } else {
                    alert("Error al registrar el pedido: " + data.message);
                }
            })
            .catch(error => {
                alert("No se pudo conectar con el servidor. Intente nuevamente.");
            })
            .finally(() => {
                btnFinalizar.disabled = false;
                btnFinalizar.innerText = "Finalizar Pedido";
            });
        };
    </script>
</body>
</html>
