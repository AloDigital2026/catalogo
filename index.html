<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Don Arturo - Catálogo Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Tienda Don Arturo - <span>Catálogo Premium</span></h1>
    </header>

    <main class="catalogo" id="grid"></main>

    <footer class="footer">
        <div class="footer-content" style="flex-direction: column; gap: 8px;">

            <p id="estado-arturo" style="
                width: 100%;
                text-align: center;
                min-height: 22px;
                margin: 0;
                padding: 6px;
                color: #4ade80;
                font-size: 14px;
                font-style: italic;
                background: rgba(0,0,0,0.3);
                border-radius: 6px;
            "></p>

            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <div class="total-box">
                    Subtotal Estimado
                    <span id="total">COP $0</span>
                </div>
                <div>
                    <button class="btn-finalizar" id="btn-voz" style="margin-right: 10px; background: #333;">🎤 Pedir por voz</button>
                    <button class="btn-finalizar" id="btn-finalizar">Finalizar Pedido</button>
                </div>
            </div>

            <details style="width: 100%; margin-top: 4px;">
                <summary style="cursor: pointer; color: #888; font-size: 13px;">⚙️ Ajustar voz de Arturo</summary>
                <div style="margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                    <select id="voz-selector" style="padding: 5px;"></select>
                    <button id="btn-probar-voz" style="padding: 5px 10px;">🔊 Probar voz</button>
                </div>
            </details>

        </div>
    </footer>

    <script>
        const grid = document.getElementById('grid');
        const totalTXT = document.getElementById('total');
        const btnFinalizar = document.getElementById('btn-finalizar');
        const btnVoz = document.getElementById('btn-voz');
        const estadoArturo = document.getElementById('estado-arturo');

        const URL_BACKEND = 'https://script.google.com/macros/s/AKfycbzDPoeuLQOOKbS_3eblLFcuRUmYr1Wsxjq5pM2tQKUbSNXOCraqe4QrGKp-8q0MZkzmqw/exec';

        let totalAcumulado = 0;
        let productosSeleccionados = [];
        let conversacionArturo = [];
        let vozSeleccionada = null;

        function mostrarProductos(lista) {
            grid.innerHTML = '';
            lista.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'producto';

                card.innerHTML = `
                    <div class="indicador"></div>
                    <div class="img-placeholder">
                        <img src="img/${prod.img}" alt="${prod.nombre}" class="img-producto">
                    </div>
                    <h3>${prod.nombre}</h3>
                    <div class="precio">COP $${prod.precio.toLocaleString('es-CO')}</div>
                `;

                card.onclick = function() {
                    card.classList.toggle('seleccionado');

                    if (card.classList.contains('seleccionado')) {
                        totalAcumulado += prod.precio;
                        productosSeleccionados.push(prod);
                    } else {
                        totalAcumulado -= prod.precio;
                        productosSeleccionados = productosSeleccionados.filter(item => item.id !== prod.id);
                    }

                    totalTXT.innerText = `COP $${totalAcumulado.toLocaleString('es-CO')}`;
                };

                grid.appendChild(card);
            });
        }

        fetch('productos.json')
            .then(response => {
                if (!response.ok) throw new Error('Error al cargar JSON');
                return response.json();
            })
            .then(data => mostrarProductos(data))
            .catch(error => {
                const respaldoFijo = [
                    { "id": 1, "nombre": "Leche Alquería (1 Litro)", "precio": 4900, "img": "prod_01.jpg" },
                    { "id": 2, "nombre": "Pan Tajado Bimbo Grande", "precio": 9200, "img": "prod_02.jpg" },
                    { "id": 3, "nombre": "Chocolatinas Surtidas", "precio": 3500, "img": "prod_03.jpg" },
                    { "id": 4, "nombre": "Azúcar Manuelita (1 Kg)", "precio": 4200, "img": "prod_04.jpg" },
                    { "id": 5, "nombre": "Café Sello Rojo (250g)", "precio": 6800, "img": "prod_05.jpg" },
                    { "id": 6, "nombre": "Aceite Premier (1.000 ml)", "precio": 12800, "img": "prod_06.jpg" }
                ];
                mostrarProductos(respaldoFijo);
            });

        // ===== SELECTOR DE VOZ =====
        function cargarVoces() {
            const voces = speechSynthesis.getVoices();
            const vocesEspanol = voces.filter(v => v.lang.toLowerCase().startsWith('es'));
            const selector = document.getElementById('voz-selector');

            selector.innerHTML = '';
            vocesEspanol.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.name;
                opt.textContent = `${v.name} (${v.lang})`;
                selector.appendChild(opt);
            });

            const guardada = localStorage.getItem('vozArturo');
            const encontrada = vocesEspanol.find(v => v.name === guardada);

            if (encontrada) {
                selector.value = encontrada.name;
                vozSeleccionada = encontrada;
            } else if (vocesEspanol.length > 0) {
                vozSeleccionada = vocesEspanol[0];
                selector.value = vozSeleccionada.name;
            }
        }

        speechSynthesis.onvoiceschanged = cargarVoces;
        cargarVoces();

        document.getElementById('voz-selector').onchange = function() {
            const voces = speechSynthesis.getVoices();
            vozSeleccionada = voces.find(v => v.name === this.value);
            localStorage.setItem('vozArturo', this.value);
        };

        document.getElementById('btn-probar-voz').onclick = function() {
            hablar('Buenas, tienda de Don Arturo. ¿Qué producto desea llevar?');
        };

        function hablar(texto) {
            const utterance = new SpeechSynthesisUtterance(texto);
            if (vozSeleccionada) {
                utterance.voice = vozSeleccionada;
                utterance.lang = vozSeleccionada.lang;
            } else {
                utterance.lang = 'es-CO';
            }
            utterance.rate = 0.95;
            utterance.pitch = 0.85;
            speechSynthesis.speak(utterance);
        }

        // ===== CONVERSACIÓN CON ARTURO =====
        function iniciarTurnoConversacion() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                estadoArturo.innerText = "⚠️ Su navegador no soporta pedidos por voz. Use Chrome.";
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'es-CO';
            recognition.interimResults = false;

            let yaProcesado = false; // evita que se quede "pegado" si nada responde

            btnVoz.disabled = true;
            btnVoz.innerText = "🎤 Escuchando...";
            estadoArturo.innerText = "🎤 Escuchando... hable ahora.";

            // Tiempo máximo de espera: si no detecta nada en 8 segundos, se detiene solo
            const timeoutSeguridad = setTimeout(() => {
                if (!yaProcesado) {
                    recognition.stop();
                }
            }, 8000);

            recognition.start();

            recognition.onresult = function(event) {
                yaProcesado = true;
                clearTimeout(timeoutSeguridad);

                const textoHablado = event.results[0][0].transcript;
                btnVoz.innerText = "🎤 Arturo está pensando...";
                estadoArturo.innerText = `Escuché: "${textoHablado}" — Arturo está pensando...`;

                const params = new URLSearchParams({
                    accion: 'hablarConArturo',
                    texto: textoHablado,
                    historial: JSON.stringify(conversacionArturo)
                });

                fetch(URL_BACKEND + '?' + params.toString())
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        conversacionArturo = data.historial;
                        estadoArturo.innerText = `🗣️ Arturo: ${data.respuesta}`;
                        hablar(data.respuesta);

                        if (data.terminado) {
                            estadoArturo.innerText = `✅ Pedido #${data.pedido_id} confirmado — Total: $${Number(data.total).toLocaleString('es-CO')} COP`;
                            conversacionArturo = [];
                            btnVoz.disabled = false;
                            btnVoz.innerText = "🎤 Pedir por voz";
                        } else {
                            setTimeout(() => {
                                btnVoz.disabled = false;
                                btnVoz.innerText = "🎤 Pedir por voz";
                                iniciarTurnoConversacion();
                            }, 3500);
                        }
                    } else {
                        estadoArturo.innerText = "⚠️ " + (data.message || "Arturo no pudo entender. Intente de nuevo.");
                        btnVoz.disabled = false;
                        btnVoz.innerText = "🎤 Pedir por voz";
                    }
                })
                .catch(error => {
                    estadoArturo.innerText = "❌ No se pudo conectar con Arturo.";
                    btnVoz.disabled = false;
                    btnVoz.innerText = "🎤 Pedir por voz";
                });
            };

            recognition.onerror = function(event) {
                yaProcesado = true;
                clearTimeout(timeoutSeguridad);

                if (event.error === 'no-speech') {
                    estadoArturo.innerText = "🤔 No escuché nada. Toque el botón e intente de nuevo.";
                } else {
                    estadoArturo.innerText = "⚠️ No se pudo escuchar correctamente. Intente de nuevo.";
                }
                btnVoz.disabled = false;
                btnVoz.innerText = "🎤 Pedir por voz";
            };

            // Red de seguridad final: si por cualquier razón termina sin resultado ni error,
            // esto SIEMPRE se ejecuta y evita que el botón quede trabado.
            recognition.onend = function() {
                clearTimeout(timeoutSeguridad);
                if (!yaProcesado) {
                    estadoArturo.innerText = "🤔 No escuché nada. Toque el botón e intente de nuevo.";
                    btnVoz.disabled = false;
                    btnVoz.innerText = "🎤 Pedir por voz";
                }
            };
        }

        btnVoz.onclick = function() {
            iniciarTurnoConversacion();
        };

        // ===== FINALIZAR PEDIDO MANUAL (SOLO PARA PRODUCTOS TOCADOS EN PANTALLA) =====
        btnFinalizar.onclick = function() {
            if (productosSeleccionados.length === 0) {
                alert("Este botón es solo para pedidos armados tocando los productos del catálogo.\n\nSi ya habló con Arturo por voz, su pedido ya quedó registrado — no necesita presionar este botón.");
                return;
            }

            const direccion = prompt("Ingrese la dirección de entrega:");
            if (!direccion) {
                alert("Debe ingresar una dirección para continuar.");
                return;
            }

            const observaciones = prompt("Observaciones (opcional): ej. sin bolsa, tocar el timbre, cambiar marca...") || "";

            let formaPago = prompt("¿Cómo desea pagar? Escriba: Efectivo, Nequi, Daviplata o Tarjeta");
            if (!formaPago) {
                formaPago = "No especificado";
            }

            const nombresPedido = productosSeleccionados.map(p => p.nombre).join(", ");

            const params = new URLSearchParams({
                accion: 'crearPedido',
                fecha: new Date().toLocaleString(),
                direccion: direccion,
                pedido: nombresPedido,
                total: totalAcumulado,
                origen: 'Web Catálogo',
                pago: formaPago,
                notas: observaciones,
                estado: 'Recibido'
            });

            btnFinalizar.disabled = true;
            btnFinalizar.innerText = "Enviando...";

            fetch(URL_BACKEND + '?' + params.toString())
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    alert(`¡Pedido #${data.id} registrado correctamente!\nTotal: $${totalAcumulado.toLocaleString('es-CO')} COP.`);
                    productosSeleccionados = [];
                    totalAcumulado = 0;
                    totalTXT.innerText = `COP $0`;
                    document.querySelectorAll('.producto.seleccionado').forEach(el => el.classList.remove('seleccionado'));
                } else {
                    alert("Error al registrar el pedido: " + data.message);
                }
            })
            .catch(error => {
                alert("No se pudo conectar con el servidor. Intente nuevamente.");
            })
            .finally(() => {
                btnFinalizar.disabled = false;
                btnFinalizar.innerText = "Finalizar Pedido";
            });
        };
    </script>
</body>
</html>
