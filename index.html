<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Don Arturo - Catálogo Premium</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .selector-cantidad {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
        }
        .btn-cantidad {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: #333;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .btn-cantidad:hover { background: #555; }
        .btn-cantidad:disabled { background: #ccc; cursor: not-allowed; }
        .cantidad-numero {
            min-width: 20px;
            text-align: center;
            font-weight: bold;
        }
        .producto.seleccionado { border-color: #4ade80; }
    </style>
</head>
<body>

    <header class="header">
        <h1>Tienda Don Arturo - <span>Catálogo Premium</span></h1>
    </header>

    <main class="catalogo" id="grid"></main>

    <footer class="footer">
        <div class="footer-content" style="flex-direction: column; gap: 8px;">

            <p id="estado-arturo" style="
                width: 100%;
                text-align: center;
                min-height: 22px;
                margin: 0;
                padding: 6px;
                color: #4ade80;
                font-size: 14px;
                font-style: italic;
                background: rgba(0,0,0,0.3);
                border-radius: 6px;
            "></p>

            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <div class="total-box">
                    Subtotal Estimado
                    <span id="total">COP $0</span>
                </div>
                <div>
                    <button class="btn-finalizar" id="btn-voz" style="margin-right: 10px; background: #333;">🎤 Hablar con Arturo</button>
                    <button class="btn-finalizar" id="btn-finalizar">Finalizar Pedido</button>
                </div>
            </div>

        </div>
    </footer>

    <script type="module">
        import { GoogleGenAI, Modality } from "https://esm.sh/@google/genai@1.29.0";

        const grid = document.getElementById('grid');
        const totalTXT = document.getElementById('total');
        const btnFinalizar = document.getElementById('btn-finalizar');
        const btnVoz = document.getElementById('btn-voz');
        const estadoArturo = document.getElementById('estado-arturo');

        // URL del backend de siempre (Apps Script): pedidos, catálogo, etc.
        const URL_BACKEND = 'https://script.google.com/macros/s/AKfycbzDPoeuLQOOKbS_3eblLFcuRUmYr1Wsxjq5pM2tQKUbSNXOCraqe4QrGKp-8q0MZkzmqw/exec';

        // ⚠️ REEMPLAZAR: dirección del sitio nuevo de Netlify (Parte 2 de la guía),
        // una vez que exista. Tiene esta forma:
        // https://NOMBRE-DEL-SITIO.netlify.app/.netlify/functions/arturo-voz-token
        const URL_TOKEN_VOZ = 'https://alodigital-voz-catalogo.netlify.app/.netlify/functions/arturo-voz-token';

        const MODELO_VOZ = 'gemini-3.1-flash-live-preview';

        let totalAcumulado = 0;
        let cantidades = {}; // { id: { producto, cantidad } }

        function recalcularTotal() {
            totalAcumulado = 0;
            Object.values(cantidades).forEach(item => {
                totalAcumulado += item.producto.precio * item.cantidad;
            });
            totalTXT.innerText = `COP $${totalAcumulado.toLocaleString('es-CO')}`;
        }

        function actualizarTarjeta(prod) {
            const cantidadActual = cantidades[prod.id] ? cantidades[prod.id].cantidad : 0;
            const numeroEl = document.getElementById(`cantidad-${prod.id}`);
            const cardEl = document.getElementById(`card-${prod.id}`);
            if (numeroEl) numeroEl.innerText = cantidadActual;
            if (cardEl) cardEl.classList.toggle('seleccionado', cantidadActual > 0);
        }

        function cambiarCantidad(prod, delta) {
            const actual = cantidades[prod.id] ? cantidades[prod.id].cantidad : 0;
            const nueva = Math.max(0, actual + delta);

            if (nueva === 0) {
                delete cantidades[prod.id];
            } else {
                cantidades[prod.id] = { producto: prod, cantidad: nueva };
            }

            actualizarTarjeta(prod);
            recalcularTotal();
        }

        function mostrarProductos(lista) {
            grid.innerHTML = '';
            lista.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'producto';
                card.id = `card-${prod.id}`;

                card.innerHTML = `
                    <div class="indicador"></div>
                    <div class="img-placeholder">
                        <img src="img/${prod.img}" alt="${prod.nombre}" class="img-producto">
                    </div>
                    <h3>${prod.nombre}</h3>
                    <div class="precio">COP $${prod.precio.toLocaleString('es-CO')}</div>
                    <div class="selector-cantidad">
                        <button class="btn-cantidad" data-accion="menos">−</button>
                        <span class="cantidad-numero" id="cantidad-${prod.id}">0</span>
                        <button class="btn-cantidad" data-accion="mas">+</button>
                    </div>
                `;

                card.querySelector('[data-accion="menos"]').onclick = () => cambiarCantidad(prod, -1);
                card.querySelector('[data-accion="mas"]').onclick = () => cambiarCantidad(prod, 1);

                grid.appendChild(card);
            });
        }

        fetch('productos.json')
            .then(response => {
                if (!response.ok) throw new Error('Error al cargar JSON');
                return response.json();
            })
            .then(data => mostrarProductos(data))
            .catch(error => {
                const respaldoFijo = [
                    { "id": 1, "nombre": "Leche Alquería (1 Litro)", "precio": 4900, "img": "prod_01.jpg" },
                    { "id": 2, "nombre": "Pan Tajado Bimbo Grande", "precio": 9200, "img": "prod_02.jpg" },
                    { "id": 3, "nombre": "Chocolatinas Surtidas", "precio": 3500, "img": "prod_03.jpg" },
                    { "id": 4, "nombre": "Azúcar Manuelita (1 Kg)", "precio": 4200, "img": "prod_04.jpg" },
                    { "id": 5, "nombre": "Café Sello Rojo (250g)", "precio": 6800, "img": "prod_05.jpg" },
                    { "id": 6, "nombre": "Aceite Premier (1.000 ml)", "precio": 12800, "img": "prod_06.jpg" }
                ];
                mostrarProductos(respaldoFijo);
            });

        // ===================================================================
        // VOZ EN TIEMPO REAL DE DON ARTURO
        // ===================================================================
        // Igual que en la Asesora de la página web: se pide un permiso
        // temporal, el navegador se conecta directo a Gemini, capta el
        // micrófono y reproduce la voz de Arturo sin cortes.
        //
        // La diferencia importante: aquí Arturo puede "avisar" (con una
        // herramienta llamada registrar_pedido) el momento exacto en que ya
        // tiene todo lo necesario. Cuando eso pasa, el navegador es quien de
        // verdad llama al Apps Script para dejar el pedido guardado — la
        // conversación de voz, por sí sola, nunca guarda nada.

        let sesionVoz = null;
        let audioContext = null;
        let procesadorAudio = null;
        let streamMicrofono = null;
        let playbackContext = null;
        let colaReproduccion = 0;
        let pedidoYaRegistrado = false;
        let timeoutConexion = null;

        const DURACION_FADE = 0.004; // 4 milisegundos, evita "clics" entre fragmentos

        function float32APcm16Base64(buffer) {
            const pcm16 = new Int16Array(buffer.length);
            for (let i = 0; i < buffer.length; i++) {
                const s = Math.max(-1, Math.min(1, buffer[i]));
                pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
            }
            let binario = '';
            const bytes = new Uint8Array(pcm16.buffer);
            for (let i = 0; i < bytes.length; i++) binario += String.fromCharCode(bytes[i]);
            return btoa(binario);
        }

        function reproducirFragmento(base64Audio) {
            if (!playbackContext) {
                playbackContext = new AudioContext({ sampleRate: 24000 });
                colaReproduccion = playbackContext.currentTime + 0.05;
            }
            if (playbackContext.state === 'suspended') playbackContext.resume();

            const binario = atob(base64Audio);
            const bytes = new Uint8Array(binario.length);
            for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
            const pcm16 = new Int16Array(bytes.buffer);

            const audioBuffer = playbackContext.createBuffer(1, pcm16.length, 24000);
            const canal = audioBuffer.getChannelData(0);
            for (let i = 0; i < pcm16.length; i++) canal[i] = pcm16[i] / 32768;

            const fuente = playbackContext.createBufferSource();
            fuente.buffer = audioBuffer;

            const ganancia = playbackContext.createGain();
            fuente.connect(ganancia);
            ganancia.connect(playbackContext.destination);

            const inicio = Math.max(colaReproduccion, playbackContext.currentTime + 0.01);
            const duracion = audioBuffer.duration;
            const fin = inicio + duracion;

            ganancia.gain.setValueAtTime(0, inicio);
            ganancia.gain.linearRampToValueAtTime(1, inicio + DURACION_FADE);
            ganancia.gain.setValueAtTime(1, Math.max(inicio + DURACION_FADE, fin - DURACION_FADE));
            ganancia.gain.linearRampToValueAtTime(0, fin);

            fuente.start(inicio);
            colaReproduccion = fin;

            estadoArturo.innerText = '🗣️ Arturo está hablando...';
        }

        // Esta es la función que realmente deja el pedido guardado. Se llama
        // SOLO cuando Arturo avisa (con su herramienta) que ya tiene todo.
        async function registrarPedidoDesdeVoz(argumentos) {
            const params = new URLSearchParams({
                accion: 'crearPedido',
                direccion: argumentos.direccion || 'No especificada',
                pedido: argumentos.pedido || '',
                pago: argumentos.pago || 'No especificado',
                total: argumentos.total || 0,
                origen: 'Voz - Catálogo (en vivo)',
                estado: 'Recibido',
                notas: argumentos.notas || ''
            });

            const respuesta = await fetch(URL_BACKEND + '?' + params.toString());
            const datos = await respuesta.json();

            if (datos.status === 'success') {
                pedidoYaRegistrado = true;
                estadoArturo.innerText = `✅ Pedido #${datos.id} confirmado — Total: $${Number(argumentos.total || 0).toLocaleString('es-CO')} COP`;
                return { resultado: 'ok', pedido_id: datos.id };
            } else {
                return { resultado: 'error', mensaje: datos.message || 'No se pudo registrar el pedido' };
            }
        }

        async function iniciarVoz() {
            // Por seguridad, primero se cierra cualquier resto de una
            // llamada anterior que no se haya colgado bien.
            detenerVoz();

            btnVoz.disabled = true;
            btnVoz.innerText = '🎤 Conectando...';
            estadoArturo.innerText = 'Conectando con Arturo...';
            pedidoYaRegistrado = false;

            // Si en 15 segundos no se logró conectar, se avisa y se deja
            // el botón listo para intentar de nuevo, en vez de quedar
            // pegado en "Conectando..." para siempre.
            timeoutConexion = setTimeout(() => {
                estadoArturo.innerText = '⚠️ No se pudo conectar. Revise su internet e intente de nuevo.';
                detenerVoz();
            }, 15000);

            try {
                // 1. Pedir el permiso temporal al sitio nuevo de Netlify
                const respuestaToken = await fetch(URL_TOKEN_VOZ);
                const datosToken = await respuestaToken.json();
                if (!datosToken || datosToken.status !== 'success') {
                    throw new Error('sin_token');
                }

                // 2. Conexión directa navegador → Gemini, usando ese permiso
                const ai = new GoogleGenAI({ apiKey: datosToken.token });
                sesionVoz = await ai.live.connect({
                    model: MODELO_VOZ,
                    config: { responseModalities: [Modality.AUDIO] },
                    callbacks: {
                        onopen: () => {
                            if (timeoutConexion) {
                                clearTimeout(timeoutConexion);
                                timeoutConexion = null;
                            }
                            estadoArturo.innerText = '🎤 Escuchando... hable con confianza';
                            btnVoz.disabled = false;
                            btnVoz.innerText = '🔴 Terminar';
                        },
                        onmessage: async (mensaje) => {
                            const partes = mensaje?.serverContent?.modelTurn?.parts || [];
                            for (const parte of partes) {
                                if (parte.inlineData?.data) {
                                    reproducirFragmento(parte.inlineData.data);
                                }
                            }

                            const llamadas = mensaje?.toolCall?.functionCalls || [];
                            for (const llamada of llamadas) {
                                if (llamada.name === 'registrar_pedido' && !pedidoYaRegistrado) {
                                    const resultado = await registrarPedidoDesdeVoz(llamada.args || {});
                                    sesionVoz?.sendToolResponse?.({
                                        functionResponses: [
                                            { id: llamada.id, name: llamada.name, response: resultado }
                                        ]
                                    });
                                }
                            }
                        },
                        onerror: () => {
                            estadoArturo.innerText = '⚠️ Se perdió la conexión con Arturo. Intente de nuevo.';
                            detenerVoz();
                        },
                        onclose: () => {
                            if (!pedidoYaRegistrado) {
                                estadoArturo.innerText = '';
                            }
                            btnVoz.disabled = false;
                            btnVoz.innerText = '🎤 Hablar con Arturo';
                        },
                    },
                });

                // 3. Micrófono: pide permiso y empieza a mandar audio en vivo
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                streamMicrofono = stream;

                audioContext = new AudioContext({ sampleRate: 16000 });
                const fuente = audioContext.createMediaStreamSource(stream);
                procesadorAudio = audioContext.createScriptProcessor(4096, 1, 1);

                procesadorAudio.onaudioprocess = (evento) => {
                    const datos = evento.inputBuffer.getChannelData(0);
                    const base64 = float32APcm16Base64(datos);
                    sesionVoz?.sendRealtimeInput?.({
                        audio: { data: base64, mimeType: 'audio/pcm;rate=16000' },
                    });
                };

                fuente.connect(procesadorAudio);
                procesadorAudio.connect(audioContext.destination);

            } catch (error) {
                if (timeoutConexion) {
                    clearTimeout(timeoutConexion);
                    timeoutConexion = null;
                }
                estadoArturo.innerText = '⚠️ No se pudo activar la voz. Revise el permiso del micrófono e intente de nuevo.';
                btnVoz.disabled = false;
                btnVoz.innerText = '🎤 Hablar con Arturo';
            }
        }

        function detenerVoz() {
            if (timeoutConexion) {
                clearTimeout(timeoutConexion);
                timeoutConexion = null;
            }
            try { procesadorAudio?.disconnect(); } catch (e) {}
            try { if (audioContext && audioContext.state !== 'closed') audioContext.close(); } catch (e) {}
            try { streamMicrofono?.getTracks().forEach(t => t.stop()); } catch (e) {}
            try { sesionVoz?.close?.(); } catch (e) {}
            try { if (playbackContext && playbackContext.state !== 'closed') playbackContext.close(); } catch (e) {}

            // Se limpian todas las referencias para que la próxima vez que
            // se toque "Hablar con Arturo" empiece siempre desde cero, sin
            // arrastrar nada de la llamada anterior.
            sesionVoz = null;
            audioContext = null;
            procesadorAudio = null;
            streamMicrofono = null;
            playbackContext = null;
            colaReproduccion = 0;

            btnVoz.disabled = false;
            btnVoz.innerText = '🎤 Hablar con Arturo';
        }

        btnVoz.onclick = function() {
            if (btnVoz.innerText.includes('Terminar')) {
                detenerVoz();
            } else {
                iniciarVoz();
            }
        };

        // ===== FINALIZAR PEDIDO MANUAL (con los botones +/-, sin voz) =====
        btnFinalizar.onclick = function() {
            const itemsSeleccionados = Object.values(cantidades);

            if (itemsSeleccionados.length === 0) {
                alert("Use los botones + y − para elegir productos, o hable con Arturo por voz.\n\nSi ya habló con Arturo y confirmó su pedido, no necesita presionar este botón — ya quedó registrado.");
                return;
            }

            const direccion = prompt("Ingrese la dirección de entrega:");
            if (!direccion) {
                alert("Debe ingresar una dirección para continuar.");
                return;
            }

            const observaciones = prompt("Observaciones (opcional): ej. sin bolsa, tocar el timbre, cambiar marca...") || "";

            let formaPago = prompt("¿Cómo desea pagar? Escriba: Efectivo, Nequi, Daviplata o Tarjeta");
            if (!formaPago) {
                formaPago = "No especificado";
            }

            const nombresPedido = itemsSeleccionados
                .map(item => `${item.producto.nombre} x${item.cantidad}`)
                .join(", ");

            const params = new URLSearchParams({
                accion: 'crearPedido',
                fecha: new Date().toLocaleString(),
                direccion: direccion,
                pedido: nombresPedido,
                total: totalAcumulado,
                origen: 'Web Catálogo',
                pago: formaPago,
                notas: observaciones,
                estado: 'Recibido'
            });

            btnFinalizar.disabled = true;
            btnFinalizar.innerText = "Enviando...";

            fetch(URL_BACKEND + '?' + params.toString())
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    alert(`¡Pedido #${data.id} registrado correctamente!\nTotal: $${totalAcumulado.toLocaleString('es-CO')} COP.`);
                    cantidades = {};
                    recalcularTotal();
                    document.querySelectorAll('.producto').forEach(card => {
                        card.classList.remove('seleccionado');
                        const numeroEl = card.querySelector('.cantidad-numero');
                        if (numeroEl) numeroEl.innerText = '0';
                    });
                } else {
                    alert("Error al registrar el pedido: " + data.message);
                }
            })
            .catch(error => {
                alert("No se pudo conectar con el servidor. Intente nuevamente.");
            })
            .finally(() => {
                btnFinalizar.disabled = false;
                btnFinalizar.innerText = "Finalizar Pedido";
            });
        };
    </script>
</body>
</html>
